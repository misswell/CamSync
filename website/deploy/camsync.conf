server {
    listen 80;
    server_name camsync.liuguofeng.com;
    root /home/wwwroot/camsync.liuguofeng.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name camsync.liuguofeng.com;
    root /home/wwwroot/camsync.liuguofeng.com;
    index index.html;

    ssl_certificate /usr/local/nginx/conf/ssl/camsync.liuguofeng.com/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/camsync.liuguofeng.com/camsync.liuguofeng.com.key;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
